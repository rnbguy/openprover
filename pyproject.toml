[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openprover"
version = "1.0.1"
description = "Automated theorem proving using agentic system with frontier LLMs."
readme = "README.md"
authors = [{name = "Matěj Kripner", email = "kripner@ufal.mff.cuni.cz"}]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4",
    "mcp==2.0.0",
    "openai-codex==0.144.4",
    "pydantic>=2",
]

[project.scripts]
openprover = "openprover.cli:main"

[tool.setuptools.packages.find]
include = ["openprover*"]
